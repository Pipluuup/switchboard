<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    width: 340px; margin: 0; padding: 14px;
    font: 13px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0b0f1a; color: #dfe6f5;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { font-size: 11px; color: #93a0b8; margin: 0 0 12px; }
  .row { margin-bottom: 10px; }
  label { display: block; font-size: 11.5px; color: #93a0b8; margin-bottom: 3px; }
  input {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    background: #11151f; color: #dfe6f5;
    border: 1px solid #232a3a; border-radius: 6px; font-size: 12px;
  }
  button {
    width: 100%; padding: 8px 10px; margin-bottom: 8px;
    background: #1c2437; color: #dfe6f5; cursor: pointer;
    border: 1px solid #2c3550; border-radius: 7px; font-size: 12.5px;
    text-align: left;
  }
  button:hover { border-color: #7e96ff; }
  button:disabled { opacity: .5; cursor: wait; }
  .ok { color: #45c98a; } .err { color: #ff5c5c; }
  #status { font-size: 11.5px; min-height: 16px; margin-top: 4px; white-space: pre-wrap; }
  a { color: #7e96ff; text-decoration: none; font-size: 11.5px; }
  .links { margin-top: 10px; padding-top: 10px; border-top: 1px solid #1d2434; display: flex; gap: 14px; }
  details { margin-top: 10px; }
  summary { font-size: 11.5px; color: #93a0b8; cursor: pointer; }
</style>
</head>
<body>
  <h1>Switchboard Cookie 助手</h1>
  <p class="sub">登录状态会以完整 Cookie 写回网关「Plan 实时查询」配置</p>

  <button id="btn-opencode">① 写入 OpenCode Console（Go 计划）Cookie</button>
  <button id="btn-ark">② 写入火山方舟（编码计划）Cookie</button>
  <button id="btn-test">③ 测试网关连接</button>

  <div id="status"></div>

  <div class="links">
    <a href="#" id="lnk-opencode">打开 OpenCode 控制台 ↗</a>
    <a href="#" id="lnk-ark">打开火山方舟控制台 ↗</a>
  </div>

  <details>
    <summary>网关地址 / 管理令牌</summary>
    <div class="row" style="margin-top:8px">
      <label>网关地址</label>
      <input id="gw" placeholder="http://127.0.0.1:8000">
    </div>
    <div class="row">
      <label>管理令牌（后台未设置则留空）</label>
      <input id="token" type="password" placeholder="可选">
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
